    <script>
        // LOADER - Fixed version
        const counter = document.getElementById('counter');
        const progressBar = document.getElementById('progress-bar');
        const reveals = document.querySelectorAll('.reveal-wrapper');
        const body = document.body;
        
        let count = 0;
        body.style.overflow = 'hidden';
        
        const interval = setInterval(() => {
            count += Math.floor(Math.random() * 5) + 1;
            if (count > 100) count = 100;
            counter.innerText = count + '%';
            progressBar.style.width = count + '%';
            
            if (count === 100) {
                clearInterval(interval);
                
                // Add loaded class to trigger animations
                setTimeout(() => {
                    body.classList.add('loaded');
                    body.style.overflow = 'auto';
                    // Force display of content
                    document.querySelector('main').style.visibility = 'visible';
                }, 500);
                
                // Reveal text after animations
                setTimeout(() => {
                    reveals.forEach(el => el.classList.add('is-visible'));
                }, 1700);
            }
        }, 30);

        // BACKGROUND REVEAL
        const projectRows = document.querySelectorAll('.project-row');
        if (window.matchMedia("(min-width: 768px)").matches) {
            projectRows.forEach(row => {
                row.addEventListener('mouseenter', () => {
                    const targetId = row.getAttribute('data-bg');
                    const targetImg = document.getElementById(targetId);
                    if(targetImg) targetImg.classList.add('active');
                    projectRows.forEach(r => { if(r !== row) r.style.opacity = '0.3'; });
                });
                row.addEventListener('mouseleave', () => {
                    const targetId = row.getAttribute('data-bg');
                    const targetImg = document.getElementById(targetId);
                    if(targetImg) targetImg.classList.remove('active');
                    projectRows.forEach(r => r.style.opacity = '1');
                });
            });
        }

        // CURSOR
        if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
            const cursor = document.getElementById('cursor');
            const circle = document.getElementById('cursor-circle');
            const triggers = document.querySelectorAll('.hover-trigger');
            
            document.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
                setTimeout(() => {
                    circle.style.left = e.clientX + 'px';
                    circle.style.top = e.clientY + 'px';
                }, 50);
            });
            
            triggers.forEach(t => {
                t.addEventListener('mouseenter', () => body.classList.add('hovered'));
                t.addEventListener('mouseleave', () => body.classList.remove('hovered'));
            });
        }

        // SCROLL PROGRESS
        window.addEventListener('scroll', () => {
            const scrollBar = document.getElementById('scroll-bar');
            if (scrollBar) {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                scrollBar.style.height = scrolled + "%";
            }
        });

        // ROBOT TRACKING
        const robotHead = document.getElementById('robot-head');
        const robotEye = document.getElementById('robot-eye');
        
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            const rotateY = (x - centerX) / 25; 
            const rotateX = (centerY - y) / 25;
            
            const clampedY = Math.max(-45, Math.min(45, rotateY));
            const clampedX = Math.max(-30, Math.min(30, rotateX));

            if(robotHead) {
                robotHead.style.transform = `rotateY(${clampedY}deg) rotateX(${clampedX}deg)`;
            }

            const eyeMoveX = (x - centerX) / 60;
            const eyeMoveY = (y - centerY) / 60;
            if(robotEye) {
                robotEye.style.transform = `translate(calc(-50% + ${eyeMoveX}px), calc(-50% + ${eyeMoveY}px))`;
            }
        });

        // ROBOT BLINK
        function blink() {
            if(robotEye) {
                robotEye.style.height = '2px';
                setTimeout(() => { robotEye.style.height = '30px'; }, 150);
                setTimeout(blink, Math.random() * 3000 + 2000);
            }
        }
        blink();
    </script>
